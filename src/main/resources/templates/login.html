<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" >
<head th:replace="~{fragments/microgames_fr.html ::es_head}">
Error: Head -fr
</head>

<body>
<header th:replace="~{fragments/microgames_fr.html ::es_header}">

</header>
<main>
  <h3>Iniciar sesión</h3>

    <div th:if="${param.registered}">
        <p>Registro completado. Ya puedes iniciar sesión.</p>
    </div>

    <div th:if="${param.error}">
        <p th:switch="${param.error[0]}">
            <span th:case="'locked'">Tu cuenta está bloqueada temporalmente. Inténtalo de nuevo más tarde.</span>
            <span th:case="'banned'">Tu cuenta ha sido suspendida. Contacta con soporte.</span>
            <span th:case="'bad_credentials'">Correo o contraseña incorrectos.</span>
            <span th:case="*">Ha ocurrido un error al iniciar sesión.</span>
        </p>
    </div>

    <form th:action="@{/login}" method="post">
        <div>
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Entrar</button>
    </form>
</main>

<footer th:replace="~{fragments/microgames_fr.html ::es_footer}">

</footer>
</body>

</html>
